services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lightcrm
      POSTGRES_USER: lightcrm
      POSTGRES_PASSWORD: lightcrm
    ports:
      - "54329:5432"
    volumes:
      - lightcrm_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightcrm -d lightcrm"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  lightcrm_postgres:

